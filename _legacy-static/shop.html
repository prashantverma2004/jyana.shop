<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — JYANA Personal Care</title>
  <meta name="description" content="Shop the JYANA range: Underarm Roll On for all skin types and Active Sweat Guard natural deodorant roll-on. 50 ml each.">
  <meta name="theme-color" content="#f7f3ec">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;350;400;450;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="shop">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow reveal">Shop</span>
        <h1 class="display" data-split>
          <span class="split-line"><span>The JYANA</span></span>
          <span class="split-line"><span style="--d:.12s"><em>range</em>.</span></span>
        </h1>
        <p class="lead reveal" style="--d:.25s">Two roll-ons, each made for a clear purpose. Pick the one that fits your day — or keep both close.</p>
      </div>
    </section>
    <section style="padding-bottom:clamp(64px,8vw,120px)">
      <div class="container" id="shopRows"></div>
    </section>
    <section class="section bg-cream" id="compareSection">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow reveal">Side by side</span>
            <h2 class="reveal" style="--d:.1s">Find your <em>roll-on</em>.</h2>
          </div>
          <p class="lead reveal" style="--d:.2s">Not sure which to choose? Here's how they compare.</p>
        </div>
        <div id="compare"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
